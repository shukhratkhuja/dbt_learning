models:
  - name: bronze_customer
    description: "This model contains the raw customer data from the source system."
    config:
        materialized: view

  - name: bronze_product
    description: "This model contains the raw product data from the source system."
    config:
        materialized: view

  - name: bronze_sales
    description: "This model contains the raw sales data from the source system."
    columns:
      - name: sales_id
        data_tests:
          - not_null
          - unique
      - name: gross_amount
        data_tests:
          - generic_non_negative
  
  - name: bronze_store
    description: "This model contains the raw store data from the source system."
    columns:
      - name: store_sk
        data_tests:
          - not_null
          - unique
      - name: store_name
        data_tests:
          - accepted_values: 
              arguments:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']
